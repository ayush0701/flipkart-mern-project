services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    networks:
      - flipkart-network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./backend/config/config.env.example
    environment:
      PORT: "${BACKEND_PORT}"
      MONGO_URI: "mongodb://mongodb:27017/flipkart"
      NODE_ENV: "production"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - flipkart-network


  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - flipkart-mongo-data:/data/db # Maps to the new volume block
    networks:
      - flipkart-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s



volumes:
  flipkart-mongo-data:

networks:
  flipkart-network:
